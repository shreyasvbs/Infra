name: Build and Push Images

on:
  push:
    branches:
      - main
    paths:
      - three-tier-app/backend/**
      - three-tier-app/frontend/**
      - .github/workflows/build-images.yaml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGISTRY: myacr321012.azurecr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name myacr321012

      - name: Build and push backend image
        run: |
          docker build \
            --tag "$REGISTRY/backend:${GITHUB_SHA}" \
            --tag "$REGISTRY/backend:latest" \
            three-tier-app/backend
          docker push "$REGISTRY/backend:${GITHUB_SHA}"
          docker push "$REGISTRY/backend:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            --tag "$REGISTRY/frontend:${GITHUB_SHA}" \
            --tag "$REGISTRY/frontend:latest" \
            three-tier-app/frontend
          docker push "$REGISTRY/frontend:${GITHUB_SHA}"
          docker push "$REGISTRY/frontend:latest"