apiVersion: secrets-store.csi.x-k8s.io/v1

kind: SecretProviderClass

metadata:

  name: {{ .Release.Name }}-postgresql-kv

spec:

  provider: azure

  parameters:

    clientID: "{{ $.Values.global.workloadIdentity.clientId }}"

    tenantId: "{{ $.Values.global.workloadIdentity.tenantId }}"

    keyvaultName: "{{ $.Values.global.workloadIdentity.keyVaultName }}"

    usePodIdentity: "false"

    useVMManagedIdentity: "false"

    objects: |
      array:
        - |
          objectName: postgres-username
          objectType: secret

        - |
          objectName: postgres-password
          objectType: secret

  secretObjects:

    - secretName: {{ .Release.Name }}-postgresql-secrets

      type: Opaque

      data:

        - objectName: postgres-username
          key: postgres-username

        - objectName: postgres-password
          key: postgres-password