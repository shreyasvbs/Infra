{{- if and .Values.backend.enabled .Values.postgresql.enabled }}

apiVersion: batch/v1

kind: Job

metadata:

  name: {{ include "three-tier-app.fullname" . }}-migration-{{ .Release.Revision }}

  annotations:

    "helm.sh/hook": pre-install,pre-upgrade

    "helm.sh/hook-weight": "-10"

    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:

  backoffLimit: 3

  template:

    metadata:

      labels:

        app.kubernetes.io/name: migration

        app.kubernetes.io/instance: {{ .Release.Name }}

      annotations:

        azure.workload.identity/use: "true"

    spec:

      restartPolicy: Never

      serviceAccountName: {{ .Values.backend.serviceAccount.name }}

      containers:

        - name: migration

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          command:

            - /bin/sh

            - -c

          args:

            - |
              echo "Starting database migration..."

              echo "Waiting for PostgreSQL..."

              # Replace this with your real migration command.
              #
              # Example:
              # npm run migrate
              #
              # or:
              # npx prisma migrate deploy

              echo "Running simulated migration..."

              sleep 10

              echo "Database migration completed successfully."

          env:

            - name: DATABASE_URL

              valueFrom:

                secretKeyRef:

                  name: {{ include "backend.fullname" . }}-secrets

                  key: database-url

          resources:

            requests:

              cpu: "50m"

              memory: "64Mi"

            limits:

              cpu: "200m"

              memory: "128Mi"

{{- end }}