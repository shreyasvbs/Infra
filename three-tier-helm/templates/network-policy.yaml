{{- if and .Values.postgresql.enabled .Values.backend.enabled }}

apiVersion: networking.k8s.io/v1

kind: NetworkPolicy

metadata:

  name: {{ include "three-tier-app.fullname" . }}-postgresql

spec:

  podSelector:

    matchLabels:

      app.kubernetes.io/name: postgresql

      app.kubernetes.io/instance: {{ .Release.Name }}

  policyTypes:

    - Ingress

  ingress:

    - from:

        - podSelector:

            matchLabels:

              app.kubernetes.io/name: backend

              app.kubernetes.io/instance: {{ .Release.Name }}

      ports:

        - protocol: TCP

          port: 5432

{{- end }}